site_name: AI-Driven DevSecOps
site_description: CRACCON'26 demo — security as a continuous feedback loop
site_url: https://soumyadip007.github.io/AI-Driven-DevSecOps/
repo_url: https://github.com/soumyadip007/AI-Driven-DevSecOps
repo_name: soumyadip007/AI-Driven-DevSecOps
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Concepts:
      - Glossary (SAST, SCA, …): concepts/glossary.md
      - Security loop: concepts/security-loop.md
      - LLM (Ollama): concepts/llm.md
  - Projects:
      - Overview & connection: projects.md
      - Architecture: architecture.md
  - Demo:
      - Step-by-step walkthrough: demo-walkthrough.md
      - Stage script: demo-script.md
      - Tooling: tooling.md
      - CI explained: ci.md
  - Outputs:
      - Artifacts guide: outputs/index.md
      - Layout plan: outputs/layout.md
  - Plan: plan.md

# JSON / remediated files under docs/outputs are static assets; ignore nav omissions.
validation:
  omitted_files: ignore
  unrecognized_links: ignore
  absolute_links: ignore
