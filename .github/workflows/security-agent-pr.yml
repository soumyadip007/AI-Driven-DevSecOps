name: security-agent-pr

# Creates a remediation PR using the heuristic agent (no LLM).
# Requires repo setting OR a PAT — see docs/ci.md § Remediation PR workflow.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [security]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: security-agent-pr
  cancel-in-progress: true

jobs:
  agent-heuristic-pr:
    name: agent-heuristic → PR
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/vuln-shop/package-lock.json

      - name: Install vuln-shop deps
        working-directory: apps/vuln-shop
        run: npm ci

      - name: Try download security-summary from security workflow
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: security-summary
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare summary (fixture fallback)
        run: |
          mkdir -p artifacts
          if [[ ! -s artifacts/security-summary.json ]]; then
            echo "Using fixtures/findings → security-summary.json"
            cp fixtures/findings/* artifacts/ || true
            node scripts/aggregate-security-summary.js
          else
            echo "Using downloaded security-summary.json"
            ls -la artifacts/
          fi

      - name: Run agent-heuristic and stage reports
        run: |
          chmod +x scripts/ci-agent-heuristic.sh
          bash scripts/ci-agent-heuristic.sh

      - name: Notice about PR permissions
        run: |
          echo "::notice::PR create needs: Settings → Actions → General → Allow GitHub Actions to create and approve pull requests — OR secret AGENT_PR_TOKEN (repo PAT). See docs/ci.md"

      - name: Create or update remediation pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          # Prefer PAT secret if set — GITHUB_TOKEN needs the repo Actions setting enabled.
          token: ${{ secrets.AGENT_PR_TOKEN != '' && secrets.AGENT_PR_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: |
            fix(vuln-shop): apply heuristic security-agent remediations

            Opened by CI (make agent-heuristic / --llm none). Human merge approval required.
          title: "fix(security): agent-heuristic remediations for vuln-shop"
          body-path: reports/security-agent/pr-body.md
          branch: agent/heuristic-remediation
          delete-branch: false
          add-paths: |
            apps/vuln-shop/src/routes/products.js
            apps/vuln-shop/package.json
            apps/vuln-shop/package-lock.json
            apps/vuln-shop/Dockerfile
            reports/security-agent/**

      - name: Explain PR permission failure
        if: failure() && steps.cpr.outcome == 'failure'
        run: |
          echo "::error::PR creation failed. Most common cause: GitHub Actions is not allowed to create PRs."
          echo ""
          echo "Fix (pick one):"
          echo "1) Repo Settings → Actions → General → Workflow permissions"
          echo "   - Read and write permissions"
          echo "   - ☑ Allow GitHub Actions to create and approve pull requests"
          echo "2) Add repository secret AGENT_PR_TOKEN = classic PAT with 'repo' scope"
          echo "   then re-run this workflow."
          echo ""
          echo "Settings URL: https://github.com/${{ github.repository }}/settings/actions"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "### Security agent PR" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: **heuristic** (\`make agent-heuristic\` / \`--llm none\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: ${{ steps.cpr.outputs.pull-request-url || 'not created yet' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`agent/heuristic-remediation\` (push may succeed even if PR create is blocked)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If PR create failed: enable Actions → allow creating PRs, or set \`AGENT_PR_TOKEN\`." >> "$GITHUB_STEP_SUMMARY"
