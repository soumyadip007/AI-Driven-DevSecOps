name: Security CI

# On each run, also disable the orphaned agent-pr.yml workflow (duplicate sidebar entry).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for this Security CI run"
        required: false
        default: "manual trigger"

permissions:
  contents: read
  actions: write

# Vulnerability analysis → GitHub Actions Artifact "world"

jobs:
  disable-orphan-agent-pr:
    name: disable-orphan-agent-pr
    runs-on: ubuntu-latest
    # Only on main pushes — remove duplicate "Agent PR" left by filename rename
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Disable obsolete .github/workflows/agent-pr.yml workflow
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer path lookup; fall back to known id from this repo
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '.workflows[] | select(.path==".github/workflows/agent-pr.yml") | .id' | head -1 || true)"
          ID="${ID:-391847386}"
          STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${ID}" --jq '.state' || echo missing)"
          echo "Orphan workflow id=${ID} state=${STATE}"
          if [ "$STATE" = "active" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${ID}/disable"
            echo "Disabled orphan agent-pr.yml (duplicate Agent PR sidebar entry)."
          else
            echo "Nothing to disable (state=${STATE})."
          fi

  tests:
    name: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vuln-shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/vuln-shop/package-lock.json
      - run: npm ci
      - run: npm test

  sast-semgrep:
    name: sast-semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          mkdir -p artifacts/world
          semgrep scan \
            --config policies/semgrep \
            --json \
            --output artifacts/world/semgrep.json \
            apps/vuln-shop || true
          python3 - <<'PY'
          import json
          data = json.load(open("artifacts/world/semgrep.json"))
          results = data.get("results", [])
          print(f"Semgrep findings: {len(results)}")
          for r in results:
              print("-", r.get("check_id"), r.get("path"), r.get("start", {}).get("line"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-semgrep
          path: artifacts/world/semgrep.json
          retention-days: 14

  sca-trivy:
    name: sca-trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install npm deps for lockfile scan
        working-directory: apps/vuln-shop
        run: npm ci
      - name: Prepare world dir
        run: mkdir -p artifacts/world
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: apps/vuln-shop
          format: json
          output: artifacts/world/trivy.json
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-trivy
          path: artifacts/world/trivy.json
          if-no-files-found: warn
          retention-days: 14

  policy-conftest:
    name: policy-conftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Conftest CLI
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/
          conftest --version
      - name: Validate Dockerfile policies
        run: |
          mkdir -p artifacts/world
          set +e
          conftest test apps/vuln-shop/Dockerfile \
            --policy policies/conftest \
            --output json > artifacts/world/conftest.json
          conftest test apps/vuln-shop/Dockerfile \
            --policy policies/conftest | tee artifacts/world/conftest.txt
          set -e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-conftest
          path: |
            artifacts/world/conftest.json
            artifacts/world/conftest.txt
          retention-days: 14

  aggregate:
    name: aggregate-world-summary
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sca-trivy, policy-conftest]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Collect into artifacts/world
        run: |
          mkdir -p artifacts/world/runs
          STAMP=$(date +%Y%m%d-%H%M%S)
          find downloaded -type f -print || true
          cp downloaded/world-semgrep/semgrep.json artifacts/world/ 2>/dev/null || true
          cp downloaded/world-trivy/trivy.json artifacts/world/ 2>/dev/null || true
          cp downloaded/world-conftest/conftest.json artifacts/world/ 2>/dev/null || true
          cp downloaded/world-conftest/conftest.txt artifacts/world/ 2>/dev/null || true
          [[ -s artifacts/world/semgrep.json ]] || cp fixtures/findings/semgrep.json artifacts/world/
          [[ -s artifacts/world/trivy.json ]] || cp fixtures/findings/trivy.json artifacts/world/
          [[ -s artifacts/world/conftest.json ]] || cp fixtures/findings/conftest.json artifacts/world/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Aggregate summary + stamp run
        run: |
          ARTIFACTS_DIR=artifacts/world node scripts/aggregate-security-summary.js
          STAMP=$(date +%Y%m%d-%H%M%S)
          mkdir -p "artifacts/world/runs/$STAMP"
          for f in semgrep.json trivy.json conftest.json conftest.txt security-summary.json; do
            [[ -f "artifacts/world/$f" ]] && cp "artifacts/world/$f" "artifacts/world/runs/$STAMP/"
          done
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "World run stamped: $STAMP"
      - name: Print summary
        run: |
          python3 - <<'PY'
          import json
          s = json.load(open("artifacts/world/security-summary.json"))
          print(json.dumps(s["counts"], indent=2))
          for f in s.get("findings", [])[:20]:
              print(f"- {f['finding_id']}: {f['message'][:140]}")
          PY
      - name: Upload world Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: world
          path: artifacts/world/
          retention-days: 30
          if-no-files-found: error

  demo-findings:
    name: demo-findings-report
    runs-on: ubuntu-latest
    needs: [aggregate]
    if: always() && needs.aggregate.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: world
          path: artifacts/world
      - name: Report intentional demo findings
        run: |
          python3 <<'PY'
          import json
          s = json.load(open("artifacts/world/security-summary.json"))
          total = s.get("counts", {}).get("total", 0)
          print(f"Total findings: {total}")
          for f in s.get("findings", []):
              print(f"- [{f.get('category')}] {f.get('finding_id')}: {f.get('message')}")
          if total > 0:
              print(
                  f"::warning::Demo: {total} intentional findings. "
                  "Download Actions Artifact 'world' from this run."
              )
          else:
              print("::notice::No findings in world security-summary.")
          PY
      - name: Job summary
        run: |
          echo "### Security CI — world artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download artifact: **\`world\`** (bottom of this run page)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contains: \`artifacts/world/*\` (summary, Semgrep, Trivy, Conftest, runs/)" >> "$GITHUB_STEP_SUMMARY"
